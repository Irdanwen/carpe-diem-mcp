# http{} context (e.g. /etc/nginx/conf.d/carpe-mcp.conf). Loaded once, used by the vhost.

# Access log without the query string ($uri, not $request_uri) and without any header
# that could carry a token. Authorization is never logged by Nginx's formats anyway.
log_format carpe_mcp '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

# /media/<id> (temporary outputs): the id is the capability, so the path is not logged.
log_format carpe_mcp_media '$remote_addr [$time_iso8601] "$request_method /media/- $server_protocol" '
                           '$status $body_bytes_sent $request_time "$http_user_agent"';

# Unauthenticated floods hit JWT verification before the per-user limits of the app:
# a per-IP ceiling in front of it. ChatGPT and claude.ai call from a few egress IPs,
# hence a generous rate and burst.
limit_req_zone $binary_remote_addr zone=carpe_mcp:10m rate=20r/s;
# Media downloads: a person opening a link, far fewer requests, each up to 64 MiB.
limit_req_zone $binary_remote_addr zone=carpe_mcp_media:10m rate=2r/s;

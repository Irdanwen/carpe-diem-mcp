# /etc/nginx/sites-available/mcp.carpe-diem.xyz — needs deploy/nginx-http.conf in conf.d.
# Then: certbot --nginx -d mcp.carpe-diem.xyz (adds the listen 443 ssl / certificate lines).

server {
    listen 80;
    listen [::]:80;
    server_name mcp.carpe-diem.xyz;

    access_log /var/log/nginx/mcp.access.log carpe_mcp;
    error_log  /var/log/nginx/mcp.error.log warn;
    server_tokens off;

    # 40 MiB: the app's JSON limit (data: URIs of media inputs).
    client_max_body_size 40m;

    location = /mcp {
        limit_req zone=carpe_mcp burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP: responses and the GET event stream are SSE.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # RFC 9728 metadata (root, and under /mcp where MCP clients look first).
    location ^~ /.well-known/oauth-protected-resource {
        limit_req zone=carpe_mcp burst=100 nodelay;
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        access_log off;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }
}

# /etc/nginx/sites-available/mcp.carpe-diem.xyz — needs deploy/nginx-http.conf in conf.d.
# Complete as it is: certbot only obtains and renews the certificate, by webroot (`certbot certonly
# --webroot -w /var/www/acme`, see deploy/README.md "Install"; no nginx plugin needed) and never edits
# this file, so an update can replace it as is. The certificate is read from /etc/nginx/ssl/mcp.carpe-diem.xyz/
# (links to /etc/letsencrypt/live/mcp.carpe-diem.xyz/, or a temporary self-signed pair before the first one).

# Port 80: our own block, not certbot's (which would log the whole request line, /media/<id> included).
# Everything is redirected to https; logged like the https side: no query string, /media/<id> as /media/-.
# Certificate issuance and renewals answer their HTTP-01 challenge here, from the webroot /var/www/acme.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.carpe-diem.xyz;
    server_tokens off;

    access_log /var/log/nginx/mcp.access.log carpe_mcp;
    error_log  /var/log/nginx/mcp.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location ^~ /media/ {
        access_log /var/log/nginx/mcp.access.log carpe_mcp_media;
        return 301 https://mcp.carpe-diem.xyz$request_uri;
    }

    location / {
        return 301 https://mcp.carpe-diem.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.carpe-diem.xyz;

    ssl_certificate     /etc/nginx/ssl/mcp.carpe-diem.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mcp.carpe-diem.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:carpe_mcp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mcp.access.log carpe_mcp;
    # The error log records, for each event it reports (a request over a rate limit, an unreachable
    # container…), the client address and the request line, query string included. MCP clients put
    # nothing secret in the URL (the token is in Authorization); /media/ is kept out below. Use `crit`
    # here to keep request lines out of it altogether.
    error_log  /var/log/nginx/mcp.error.log warn;
    server_tokens off;

    # Every rate limit answers 429 (nginx's default is 503).
    limit_req_status 429;

    # 40 MiB: the app's JSON limit (data: URIs of media inputs).
    client_max_body_size 40m;

    # Inherited by every location below (none sets its own proxy_set_header).
    # The client's own X-Forwarded-For / X-Real-IP are replaced, never passed on.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /mcp {
        limit_req zone=carpe_mcp burst=100 nodelay;
        proxy_pass http://127.0.0.1:3333;

        # Streamable HTTP: responses and the GET event stream are SSE.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # RFC 9728 metadata (root, and under /mcp where MCP clients look first).
    location ^~ /.well-known/oauth-protected-resource {
        limit_req zone=carpe_mcp burst=100 nodelay;
        proxy_pass http://127.0.0.1:3333;
    }

    # Temporary media: outputs too large to return inline, one hour, no authentication (the 128-bit id
    # is the capability). GET, and HEAD (which `limit_except GET` allows too, by design: the app answers
    # it with the same headers and no body); anything else 403. The id stays out of both logs.
    location ^~ /media/ {
        limit_except GET { deny all; }
        limit_req zone=carpe_mcp_media burst=20 nodelay;
        access_log /var/log/nginx/mcp.access.log carpe_mcp_media;
        error_log  /var/log/nginx/mcp.error.log crit;

        proxy_pass http://127.0.0.1:3333;
        # Streamed to the client, never spooled to a temporary file on disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    location = /health {
        limit_req zone=carpe_mcp_health burst=5 nodelay;
        proxy_pass http://127.0.0.1:3333;
        access_log off;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }
}
